name: Studio media verification
on:
  pull_request:
    paths:
      - 'scripts/studio/**'
      - '.github/workflows/studio-verification.yml'
  push:
    paths:
      - 'scripts/studio/**'
      - '.github/workflows/studio-verification.yml'
permissions:
  contents: read
jobs:
  media-and-http:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install media engine
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Install independent interchange reader for verification
        run: python -m pip install opentimelineio==0.18.1
      - name: Install pinned imaging engines for real pixel verification
        run: python -m pip install numpy==2.3.5 opencolorio==2.6.0 rawpy==0.27.1 OpenEXR==3.4.15
      - name: Verify real media, adapters, and project API
        run: |
          python3 - <<'PY'
          import os, subprocess, sys
          environment = dict(os.environ, CINEMATICUM_IMAGING_PYTHON=sys.executable)
          subprocess.run([sys.executable, '-m', 'unittest', 'discover', '-s', 'scripts/studio', '-p', 'test_*.py', '-v'], env=environment, check=True)
          PY
      - name: Check editor JavaScript
        run: |
          for file in scripts/studio/web/*.js scripts/studio/macos/*.js; do
            node --check "$file"
          done
