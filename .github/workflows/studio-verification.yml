name: Studio media verification
on:
  pull_request:
    paths:
      - 'scripts/studio/**'
      - '.github/workflows/studio-verification.yml'
  push:
    paths:
      - 'scripts/studio/**'
      - '.github/workflows/studio-verification.yml'
permissions:
  contents: read
jobs:
  media-and-http:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install media engine
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Install independent interchange reader for verification
        run: python -m pip install opentimelineio==0.18.1
      - name: Verify real media, adapters, and project API
        run: python3 -m unittest discover -s scripts/studio -p 'test_*.py' -v
      - name: Check editor JavaScript
        run: |
          for file in scripts/studio/web/*.js scripts/studio/macos/*.js; do
            node --check "$file"
          done
