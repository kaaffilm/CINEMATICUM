name: verify-jurisdiction-import
on:
  pull_request:
    paths:
      - 'JURISDICTION/**'
      - 'scripts/verify-jurisdiction-import.mjs'
      - '.github/workflows/verify-jurisdiction-import.yml'
  push:
    branches: [main]
    paths:
      - 'JURISDICTION/**'
      - 'scripts/verify-jurisdiction-import.mjs'
      - '.github/workflows/verify-jurisdiction-import.yml'
permissions:
  contents: read
jobs:
  verify-source-custody:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify hash-pinned imported jurisdiction source and bounded film status
        run: node scripts/verify-jurisdiction-import.mjs
